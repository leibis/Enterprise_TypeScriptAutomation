name: Main Regression

on:
  push:
    branches: ["main"]

jobs:
  regression:
    runs-on: ubuntu-latest

    steps:
      # Descarga código actualizado.
      - name: Checkout
        uses: actions/checkout@v4

      # Configura Node.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Instala dependencias.
      - name: Install dependencies
        run: npm ci

      # Instala Playwright.
      - name: Install Playwright
        run: npx playwright install --with-deps

      # Ejecuta regresión.
      - name: Regression tests
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        run: npx playwright test --grep "@regression"

      # 1. Publica el reporte HTML visual (Resumen ejecutivo)
      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-main
          path: playwright-report/

      # 2. Publica la evidencia forense (Trace Viewer / Debugging profundo)
      - name: Upload Playwright Test Results & Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
